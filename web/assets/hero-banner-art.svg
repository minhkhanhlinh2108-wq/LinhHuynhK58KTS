<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Light Halo -->
  <circle cx="270" cy="160" r="130" fill="url(#skyGrad)" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="380" cy="110" r="80" fill="#38bdf8" opacity="0.22" filter="url(#softGlow)"/>

  <!-- University Dome & Columns Silhouette in background -->
  <g opacity="0.22" fill="#4338ca">
    <!-- Main Classical Pediment -->
    <path d="M140 180 L270 120 L400 180 H140 Z"/>
    <!-- Dome on top -->
    <path d="M235 120 C235 100 250 85 270 85 C290 85 305 100 305 120 Z"/>
    <rect x="268" y="72" width="4" height="13" rx="2" fill="#fbbf24"/>
    <circle cx="270" cy="70" r="4" fill="#fbbf24"/>
    <!-- Pillars -->
    <rect x="160" y="180" width="16" height="80" rx="3"/>
    <rect x="200" y="180" width="16" height="80" rx="3"/>
    <rect x="240" y="180" width="16" height="80" rx="3"/>
    <rect x="284" y="180" width="16" height="80" rx="3"/>
    <rect x="324" y="180" width="16" height="80" rx="3"/>
    <rect x="364" y="180" width="16" height="80" rx="3"/>
    <!-- Steps Base -->
    <rect x="130" y="260" width="280" height="12" rx="4"/>
    <rect x="110" y="272" width="320" height="12" rx="4"/>
  </g>

  <!-- Blockchain Escrow Nodes & Network Connections -->
  <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.6">
    <line x1="60" y1="120" x2="140" y2="80"/>
    <line x1="140" y1="80" x2="270" y2="40"/>
    <line x1="270" y1="40" x2="410" y2="60"/>
    <line x1="410" y1="60" x2="480" y2="120"/>
    <line x1="140" y1="80" x2="160" y2="210"/>
    <line x1="410" y1="60" x2="430" y2="210"/>
  </g>

  <!-- Blockchain Node Blocks -->
  <g>
    <!-- Block 1 -->
    <g transform="translate(45, 105)">
      <rect width="32" height="32" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text x="16" y="21" font-family="sans-serif" font-size="14" fill="#38bdf8" text-anchor="middle" font-weight="bold">#1</text>
    </g>
    <!-- Block 2 -->
    <g transform="translate(125, 65)">
      <rect width="34" height="34" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
      <text x="17" y="22" font-family="sans-serif" font-size="14" fill="#a5b4fc" text-anchor="middle" font-weight="bold">ETH</text>
    </g>
    <!-- Block 3 -->
    <g transform="translate(252, 24)">
      <rect width="36" height="36" rx="9" fill="url(#skyGrad)" stroke="#ffffff" stroke-width="2"/>
      <path d="M270 32 L262 44 L270 41 L278 44 Z" fill="#ffffff" transform="translate(-252, -24)"/>
      <path d="M270 42 L262 45 L270 55 L278 45 Z" fill="#e0e7ff" transform="translate(-252, -24)"/>
    </g>
    <!-- Block 4 -->
    <g transform="translate(395, 45)">
      <rect width="34" height="34" rx="8" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
      <text x="17" y="22" font-family="sans-serif" font-size="14" fill="#34d399" text-anchor="middle" font-weight="bold">CEI</text>
    </g>
    <!-- Block 5 -->
    <g transform="translate(465, 105)">
      <rect width="32" height="32" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text x="16" y="21" font-family="sans-serif" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="bold">✓</text>
    </g>
  </g>

  <!-- Open Book of Knowledge (Foreground Base) -->
  <g transform="translate(150, 190) scale(1.2)">
    <!-- Book Shadow -->
    <ellipse cx="100" cy="85" rx="95" ry="14" fill="#1e1b4b" opacity="0.25"/>

    <!-- Pages Base (Thickness) -->
    <path d="M10 65 C55 58 95 62 100 70 C105 62 145 58 190 65 V 72 C145 65 105 69 100 77 C95 69 55 65 10 72 Z" fill="#c7d2fe"/>
    
    <!-- Open Book Cover (Hardcover edge) -->
    <path d="M8 68 C55 61 95 65 100 73 C105 65 145 61 192 68 V 74 C145 67 105 71 100 79 C95 71 55 67 8 74 Z" fill="#3730a3"/>

    <!-- Left Page -->
    <path d="M100 70 C95 62 55 58 10 65 V 25 C55 18 95 22 100 30 Z" fill="url(#bookGrad)" stroke="#c7d2fe" stroke-width="1"/>
    <!-- Right Page -->
    <path d="M100 70 C105 62 145 58 190 65 V 25 C145 18 105 22 100 30 Z" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>
    
    <!-- Book Spine center crease -->
    <line x1="100" y1="30" x2="100" y2="70" stroke="#818cf8" stroke-width="2"/>

    <!-- Knowledge Text Lines (Golden & Indigo Lines) -->
    <line x1="25" y1="34" x2="85" y2="34" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="25" y1="42" x2="80" y2="42" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="25" y1="50" x2="75" y2="50" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <line x1="115" y1="34" x2="175" y2="34" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="115" y1="42" x2="165" y2="42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="115" y1="50" x2="170" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Glowing Bookmark Ribbon -->
    <path d="M100 30 Q105 50 115 75 L125 70 L120 55" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Big Graduation Cap (Floating gracefully above Book) -->
  <g transform="translate(195, 80) scale(1.15)">
    <!-- Cap Diamond (Mortarboard top) -->
    <polygon points="65,10 130,38 65,66 0,38" fill="url(#capGrad)" stroke="#6366f1" stroke-width="2"/>
    <!-- Highlight on top edge -->
    <path d="M0,38 L65,10 L130,38" fill="none" stroke="#a5b4fc" stroke-width="2.5" opacity="0.6"/>
    
    <!-- Skull cap underneath -->
    <path d="M30 50 V 68 C 30 84, 100 84, 100 68 V 50" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>

    <!-- Golden Button on top center -->
    <ellipse cx="65" cy="38" rx="5" ry="3.5" fill="url(#goldGrad)"/>

    <!-- Golden Tassel draping down to the side -->
    <path d="M65 38 Q 115 45 118 70" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Tassel Brush Ring -->
    <rect x="115" y="70" width="7" height="4" rx="1.5" fill="#d97706"/>
    <!-- Tassel Fringe Threads -->
    <path d="M115 74 L113 95 M117 74 L118 96 M120 74 L121 95 M122 74 L124 94" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Diploma / Degree Certificate Scroll with Ribbon (Right side foreground) -->
  <g transform="translate(385, 170) rotate(-18) scale(0.95)">
    <!-- Shadow -->
    <rect x="3" y="10" width="75" height="48" rx="6" fill="#1e1b4b" opacity="0.25"/>
    <!-- Parchment Roll -->
    <rect x="0" y="6" width="75" height="48" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <!-- Left curl roll edge -->
    <path d="M0 6 C-4 15 -4 45 0 54" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
    <!-- Right curl roll edge -->
    <path d="M75 6 C79 15 79 45 75 54" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
    
    <!-- Diploma Text lines -->
    <line x1="12" y1="18" x2="63" y2="18" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="26" x2="59" y2="26" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="34" x2="55" y2="34" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Red/Gold Ribbon Tie -->
    <rect x="33" y="4" width="9" height="52" rx="2" fill="url(#skyGrad)"/>
    <!-- Red/Gold Seal Medal -->
    <circle cx="37.5" cy="48" r="8" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="37.5,44 39,47 42,47.5 40,50 40.5,53 37.5,51.5 34.5,53 35,50 33,47.5 36,47" fill="#ffffff"/>
  </g>

  <!-- Sparkles & Radiant Star Particles of Knowledge -->
  <g fill="#fbbf24">
    <!-- Star 1 -->
    <path d="M120 140 Q120 148 128 148 Q120 148 120 156 Q120 148 112 148 Q120 148 120 140 Z"/>
    <!-- Star 2 -->
    <path d="M420 130 Q420 137 427 137 Q420 137 420 144 Q420 137 413 137 Q420 137 420 130 Z"/>
    <!-- Star 3 -->
    <path d="M220 50 Q220 55 225 55 Q220 55 220 60 Q220 55 215 55 Q220 55 220 50 Z" fill="#60a5fa"/>
    <!-- Star 4 -->
    <path d="M350 70 Q350 76 356 76 Q350 76 350 82 Q350 76 344 76 Q350 76 350 70 Z" fill="#c084fc"/>
  </g>
</svg>
