<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Blockchain Interconnecting Nodes & Constellation Lines -->
  <g stroke="url(#lineGrad)" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="80" y1="90" x2="190" y2="160" />
    <line x1="190" y1="160" x2="310" y2="110" />
    <line x1="310" y1="110" x2="430" y2="180" />
    <line x1="430" y1="180" x2="520" y2="100" />
    
    <line x1="190" y1="160" x2="150" y2="300" />
    <line x1="310" y1="110" x2="330" y2="280" />
    <line x1="430" y1="180" x2="470" y2="320" />
    
    <line x1="150" y1="300" x2="270" y2="380" />
    <line x1="270" y1="380" x2="390" y2="350" />
    <line x1="390" y1="350" x2="510" y2="420" />
    <line x1="150" y1="300" x2="100" y2="470" />
    <line x1="270" y1="380" x2="290" y2="520" />
    <line x1="390" y1="350" x2="440" y2="510" />
    <line x1="510" y1="420" x2="540" y2="540" />
  </g>

  <!-- Node Dots (Data blocks / Escrow checkpoints) -->
  <g fill="#6366f1" fill-opacity="0.22">
    <circle cx="80" cy="90" r="3.5" />
    <circle cx="190" cy="160" r="4.5" />
    <circle cx="310" cy="110" r="4" />
    <circle cx="430" cy="180" r="5" />
    <circle cx="520" cy="100" r="3.5" />
    
    <circle cx="150" cy="300" r="4.5" />
    <circle cx="330" cy="280" r="3.5" />
    <circle cx="470" cy="320" r="4" />
    
    <circle cx="270" cy="380" r="5" />
    <circle cx="390" cy="350" r="4" />
    <circle cx="510" cy="420" r="4.5" />
    <circle cx="100" cy="470" r="3.5" />
    <circle cx="290" cy="520" r="4" />
    <circle cx="440" cy="510" r="3.5" />
  </g>

  <!-- MOTIF 1: Graduation Cap (Top Left: cx ~130, cy ~80) -->
  <g transform="translate(100, 50) scale(0.7)" fill="url(#eduGrad)" stroke="#4f46e5" stroke-opacity="0.22" stroke-width="1.5">
    <path d="M50 15 L95 38 L50 60 L5 38 Z" fill-rule="evenodd"/>
    <path d="M25 48 V 70 C 25 80, 75 80, 75 70 V 48" fill="none" stroke-width="2"/>
    <path d="M85 43 V 75 C 85 78, 88 80, 91 80 C 94 80, 97 78, 97 75 V 43" fill="none" stroke-width="1.5"/>
    <circle cx="50" cy="37" r="3" fill="#6366f1" fill-opacity="0.3"/>
  </g>

  <!-- MOTIF 2: Open Book of Knowledge (Top Right: cx ~460, cy ~120) -->
  <g transform="translate(420, 90) scale(0.65)" stroke="#0284c7" stroke-opacity="0.24" stroke-width="1.5" fill="url(#eduGrad)">
    <path d="M50 70 C 40 60, 20 60, 5 65 V 25 C 20 20, 40 20, 50 30 C 60 20, 80 20, 95 25 V 65 C 80 60, 60 60, 50 70 Z"/>
    <line x1="50" y1="30" x2="50" y2="70" stroke-width="2"/>
    <path d="M15 35 C 25 32, 38 34, 44 38" fill="none" stroke-width="1"/>
    <path d="M15 45 C 25 42, 38 44, 44 48" fill="none" stroke-width="1"/>
    <path d="M85 35 C 75 32, 62 34, 56 38" fill="none" stroke-width="1"/>
    <path d="M85 45 C 75 42, 62 44, 56 48" fill="none" stroke-width="1"/>
  </g>

  <!-- MOTIF 3: Diploma / Scroll with Ribbon (Center Left: cx ~70, cy ~350) -->
  <g transform="translate(50, 320) scale(0.65)" stroke="#7c3aed" stroke-opacity="0.22" stroke-width="1.5" fill="url(#eduGrad)">
    <rect x="15" y="25" width="70" height="40" rx="4" transform="rotate(-15 50 45)"/>
    <path d="M45 20 L55 68" stroke="#4f46e5" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="44" r="5" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-opacity="0.4"/>
  </g>

  <!-- MOTIF 4: Classical University Pillars / Academy Facade (Center: cx ~310, cy ~260) -->
  <g transform="translate(290, 230) scale(0.6)" stroke="#4338ca" stroke-opacity="0.2" stroke-width="1.5" fill="url(#eduGrad)">
    <!-- Roof pediment -->
    <path d="M50 15 L95 38 H5 Z"/>
    <!-- Architrave -->
    <rect x="10" y="38" width="80" height="6" rx="1"/>
    <!-- Pillars -->
    <rect x="16" y="44" width="8" height="35" rx="1"/>
    <rect x="36" y="44" width="8" height="35" rx="1"/>
    <rect x="56" y="44" width="8" height="35" rx="1"/>
    <rect x="76" y="44" width="8" height="35" rx="1"/>
    <!-- Base steps -->
    <rect x="10" y="79" width="80" height="5" rx="1"/>
    <rect x="5" y="84" width="90" height="5" rx="1"/>
  </g>

  <!-- MOTIF 5: Graduation Cap 2 (Bottom Right: cx ~460, cy ~470) -->
  <g transform="translate(440, 440) scale(0.7)" fill="url(#eduGrad)" stroke="#4f46e5" stroke-opacity="0.22" stroke-width="1.5">
    <path d="M50 15 L95 38 L50 60 L5 38 Z" fill-rule="evenodd"/>
    <path d="M25 48 V 70 C 25 80, 75 80, 75 70 V 48" fill="none" stroke-width="2"/>
    <path d="M85 43 V 75 C 85 78, 88 80, 91 80 C 94 80, 97 78, 97 75 V 43" fill="none" stroke-width="1.5"/>
  </g>

  <!-- MOTIF 6: Smart Contract Verification Shield (Bottom Left: cx ~180, cy ~480) -->
  <g transform="translate(170, 460) scale(0.65)" stroke="#059669" stroke-opacity="0.25" stroke-width="1.5" fill="url(#eduGrad)">
    <path d="M50 15 L85 28 V 52 C 85 72, 50 85, 50 85 C 50 85, 15 72, 15 52 V 28 Z"/>
    <path d="M35 50 L45 60 L65 40" fill="none" stroke="#10b981" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Subtle Sparkle Knowledge Stars -->
  <g fill="#818cf8" fill-opacity="0.28">
    <path d="M220 70 Q220 78 228 78 Q220 78 220 86 Q220 78 212 78 Q220 78 220 70 Z" />
    <path d="M490 240 Q490 246 496 246 Q490 246 490 252 Q490 246 484 246 Q490 246 490 240 Z" />
    <path d="M120 220 Q120 226 126 226 Q120 226 120 232 Q120 226 114 226 Q120 226 120 220 Z" />
    <path d="M380 470 Q380 476 386 476 Q380 476 380 482 Q380 476 374 476 Q380 476 380 470 Z" />
  </g>
</svg>
